name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          settings_file="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"

          if [[ -z "$settings_file" ]]; then
            echo "找不到 settings.gradle"
            find . -maxdepth 4 -type f -name "settings.gradle*" -print
            exit 1
          fi

          project_dir="$(dirname "$settings_file")"
          project_dir="${project_dir#./}"

          if [[ "$project_dir" == "" ]]; then
            project_dir="."
          fi

          echo "GRADLE_PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Gradle 工程目录：$project_dir"

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$GRADLE_PROJECT_DIR" assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$GRADLE_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          echo "APK 已生成：$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zxhn-e1630-qos-v1.3-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
