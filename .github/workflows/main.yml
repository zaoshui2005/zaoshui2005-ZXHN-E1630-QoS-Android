name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_PROJECT_DIR: ZXHN E1630 QoS Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify v1.7 project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GRADLE_PROJECT_DIR/settings.gradle"
          grep -Eq "versionName[[:space:]]+['\"]1\.7['\"]" "$GRADLE_PROJECT_DIR/app/build.gradle"
          echo "Confirmed Android project version 1.7"

      - name: Build v1.7 debug APK
        shell: bash
        run: gradle -p "$GRADLE_PROJECT_DIR" clean assembleDebug --stacktrace

      - name: Check APK exists
        shell: bash
        run: test -f "$GRADLE_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload v1.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: zxhn-e1630-qos-v1.7-debug-apk
          path: 'ZXHN E1630 QoS Android/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
